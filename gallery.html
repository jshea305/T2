<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
   
</head>
<body>

    <header>
        <h1>Photo Gallery</h1>
        <p>Click any photo to view in full resolution</p>
    </header>

    <main class="gallery-grid">
        <!-- Photo 1 -->
        <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/1200x800')">
            <img src="https://via.placeholder.com/600x400" alt="Sample Image 1" loading="lazy">
            <div class="caption">Photo Title 1</div>
        </div>

        <!-- Photo 2 -->
        <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/1200x800')">
            <img src="https://via.placeholder.com/600x400" alt="Sample Image 2" loading="lazy">
            <div class="caption">Photo Title 2</div>
        </div>

        <!-- Photo 3 -->
        <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/1200x800')">
            <img src="https://via.placeholder.com/600x400" alt="Sample Image 3" loading="lazy">
            <div class="caption">Photo Title 3</div>
        </div>

        <!-- Photo 4 -->
        <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/1200x800')">
            <img src="https://via.placeholder.com/600x400" alt="Sample Image 4" loading="lazy">
            <div class="caption">Photo Title 4</div>
        </div>

        <!-- Photo 5 -->
        <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/1200x800')">
            <img src="https://via.placeholder.com/600x400" alt="Sample Image 5" loading="lazy">
            <div class="caption">Photo Title 5</div>
        </div>

        <!-- Photo 6 -->
        <div class="gallery-item" onclick="openLightbox('https://via.placeholder.com/1200x800')">
            <img src="https://via.placeholder.com/600x400" alt="Sample Image 6" loading="lazy">
            <div class="caption">Photo Title 6</div>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged view">
    </div>

    <script>
        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            lightboxImg.src = imageSrc;
            lightbox.classList.add('active');
        }

        function closeLightbox(event) {
            // Close if clicking outside the image or on the close button
            if (event.target.id === 'lightbox' || event.target.classList.contains('close-btn')) {
                document.getElementById('lightbox').classList.remove('active');
            }
        }

        // Close modal when Escape key is pressed
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('lightbox').classList.remove('active');
            }
        });
    </script>

</body>
</html>
